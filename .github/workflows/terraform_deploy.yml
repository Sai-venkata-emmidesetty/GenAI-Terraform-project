name: Terraform Deploy - Dev Environment

on:
  workflow_dispatch:
    inputs:
      tf_action:
        description: 'Terraform Action to run (apply, destroy)'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy
  push:
    branches:
      - main
    paths:
      - 'Modules/environments/dev/**'
      - 'modules/ec2-instances/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Modules/environments/dev/**'
      - 'modules/ec2-instances/**'

permissions:
  contents: read

env:
  TF_WORKING_DIR: Modules/environments/dev
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PLAN_FILE: tfplan

jobs:
  terraform:
    name: 'Terraform Plan & Apply'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Key/Secret)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.0'

      - name: Terraform Init
        id: init
        run: terraform init -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Plan and Save
        id: plan
        run: |
          PLAN_COMMAND="terraform plan -var-file=dev.tfvars -input=false -out=${{ env.PLAN_FILE }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.tf_action }}" = "destroy" ]; then
            PLAN_COMMAND="$PLAN_COMMAND -destroy"
            echo "::notice title=Destroy Plan::Running Terraform plan with -destroy flag."
          fi
          echo "Running plan command: $PLAN_COMMAND"
          $PLAN_COMMAND
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply or Destroy
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.tf_action == 'apply' || github.event.inputs.tf_action == 'destroy'))
        run: |
          echo "Applying plan file: ${{ env.PLAN_FILE }}"
          terraform apply -input=false ${{ env.PLAN_FILE }}
        working-directory: ${{ env.TF_WORKING_DIR }}
